name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  RPI_ENGINEER_DRY_RUN: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff black

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v \
            --cov=services --cov=lib --cov=modules \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60 \
            -m "not slow and not hardware"

      - name: Run integration tests
        run: pytest tests/integration/ -v -m "not slow and not hardware"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  test-ui:
    name: UI Consistency Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run HTML consistency tests
        run: pytest tests/ui/ -v

  test-docker:
    name: Docker Test Environment
    runs-on: ubuntu-latest
    needs: [test-python, test-javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f tests/docker/Dockerfile.test -t rpi-engineer-test:ci .

      - name: Run tests in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e RPI_ENGINEER_DRY_RUN=1 \
            rpi-engineer-test:ci \
            bash -lc "tests/docker/inside-run-tests.sh"

  install-test:
    name: Installation Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build install test image
        run: docker build -f tests/docker/Dockerfile.install-test -t rpi-engineer-install-test:ci .

      - name: Run install script
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -e NONINTERACTIVE=1 \
            -e DEBIAN_FRONTEND=noninteractive \
            rpi-engineer-install-test:ci \
            /bin/bash -c "cd /workspace && NONINTERACTIVE=1 bash bin/install.sh"
