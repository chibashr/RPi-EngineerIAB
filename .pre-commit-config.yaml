# Pre-commit runs on staged files. If you have unstaged changes, it stashes them,
# runs hooks (ruff/black may modify files), then restores the stash. If the
# hook changes conflict with the stash, fixes are rolled back and the commit
# fails. To avoid: stage all changes before committing (e.g. git add -u).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: local
    hooks:
      - id: pytest-unit-quick
        name: Quick unit tests
        entry: python bin/run-unit-tests-prepush.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
