<section class="module-panel" id="file-share-module">
  <header class="module-header">
    <h2>File Share</h2>
    <p class="module-subtitle">FTP and SFTP/SCP sharing from the share folder.</p>
  </header>

  <div class="module-status">
    <div class="status-item">
      <span class="status-label">FTP</span>
      <span class="status-value" id="fileshare-status-ftp">Loading...</span>
    </div>
    <div class="status-item">
      <span class="status-label">SFTP/SCP</span>
      <span class="status-value" id="fileshare-status-sftp">Loading...</span>
    </div>
    <div class="status-item">
      <span class="status-label">Share</span>
      <span class="status-value" id="fileshare-status-path">--</span>
    </div>
  </div>

  <p class="module-help">
    Configure and upload files in Advanced Mode → File Share.
  </p>
</section>

<script type="module" src="/modules/file_share/module.js"></script>
<link rel="stylesheet" href="/modules/file_share/module.css" />
