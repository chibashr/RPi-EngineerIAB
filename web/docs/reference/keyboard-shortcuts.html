<h1>Keyboard shortcuts</h1>
<p>
  Use these shortcuts to navigate the web interface efficiently.
</p>

<h2>Global</h2>
<ul>
  <li><strong>Tab</strong>: Move focus between controls.</li>
  <li><strong>Shift</strong> + <strong>Tab</strong>: Move focus backward.</li>
  <li><strong>Enter</strong>: Activate buttons and links.</li>
  <li><strong>Esc</strong>: Close dialogs.</li>
</ul>
